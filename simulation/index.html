<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Simulation — Isosudoku</title><link rel="stylesheet" href="../style.css"/></head><body><main class="workspace"><header class="masthead"><nav class="site-nav"><a href="../">Generate</a><a class="active" href="./">Simulation</a><a href="../custom-build/">Custom Build</a></nav></header><section class="tool-card"><h1>Simulation</h1><p>Run repeated single-cell digs and track the final number of givens as each puzzle is produced.</p><div class="tool-actions"><label>Runs <select id="runs"></select></label><label>Display the clipboard for grids with at most <select id="max-givens"></select> given cells</label><button id="run">Run simulation</button></div><p id="status" aria-live="polite">Ready.</p><div id="summary" hidden></div><section class="simulation-section"><h2>Final-cell histogram</h2><div id="histogram" class="histogram" aria-live="polite"></div></section><section class="simulation-section"><h2>Matching puzzle clipboards</h2><p id="clipboard-summary" class="simulation-note">Choose a threshold, then run the simulation.</p><div id="clipboards" class="clipboard-list"></div></section></section></main><script type="module" src="./main.js"></script></body></html>
