<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Verify — Isosudoku</title><link rel="stylesheet" href="../style.css"/></head><body><main class="workspace"><header class="masthead"><div class="site-header"><a class="site-title" href="../">Isosudoku</a><button class="about-button" type="button" data-open-about>About</button></div><nav class="site-nav"><a href="../">Generate</a><a href="../simulation/">Simulation</a><a href="../custom-build/">Custom Build</a><a class="active" href="./">Verify</a></nav></header><section class="tool-card"><h1>Verify</h1><p>Paste an 81-character grid using digits and dots, or edit individual cells.</p><textarea id="clipboard-grid" class="verify-paste" maxlength="200" placeholder="Paste 81 digits; use . for an empty cell"></textarea><div class="tool-actions"><button id="paste">Load clipboard text</button><button id="verify">Verify unique solution</button></div><div id="editor" class="verify-editor"></div><p id="status" aria-live="polite">Enter a grid to verify it.</p><div id="alternatives" hidden><h2>Two contrasting solutions</h2><div class="solution-pair"><div id="solution-one" class="verify-solution"></div><div id="solution-two" class="verify-solution"></div></div></div></section></main><dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title"><div class="about-dialog-content"><div class="about-dialog-heading"><h2 id="about-title">About Isosudoku</h2><button type="button" class="secondary" data-close-about>Close</button></div><p>Click the puzzle description to copy it.</p><button id="puzzle-description" class="puzzle-description" type="button">Write a single digit from 1 to 9 into each cell so that no digit can be repeated in marked areas and rows of three directions.</button><p id="about-copy-status" class="about-copy-status" aria-live="polite"></p></div></dialog><script type="module" src="./main.js"></script></body></html>
