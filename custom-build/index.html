<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Custom Build — Isosudoku</title><link rel="stylesheet" href="../style.css"/></head><body><main class="workspace"><header class="masthead"><div class="site-header"><a class="site-title" href="../">Isosudoku</a><button class="about-button" type="button" data-open-about>About</button></div><nav class="site-nav"><a href="../">Generate</a><a href="../simulation/">Simulation</a><a class="active" href="./">Custom Build</a></nav></header><section class="tool-card"><h1>Custom Build</h1><p>Highlight cells to keep as givens. The builder retains them and removes other clues only while the puzzle stays unique.</p><div id="custom-board" class="custom-board" aria-label="Select protected Isosudoku cells"></div><div class="tool-actions"><button id="clear">Clear selection</button><button id="build">Build unique puzzle</button></div><p id="status" aria-live="polite">0 protected cells selected.</p><div id="result" hidden><h2>Built puzzle</h2><div id="result-board" class="custom-board"></div></div></section></main><dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title"><div class="about-dialog-content"><div class="about-dialog-heading"><h2 id="about-title">About Isosudoku</h2><button type="button" class="secondary" data-close-about>Close</button></div><p>Click the puzzle description to copy it.</p><button id="puzzle-description" class="puzzle-description" type="button">Write a single digit from 1 to 9 into each cell so that no digit can be repeated in marked areas and rows of three directions.</button><p id="about-copy-status" class="about-copy-status" aria-live="polite"></p></div></dialog><script type="module" src="./main.js"></script></body></html>
